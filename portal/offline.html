<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덕신교회 통합 포털 · 연결 없음</title>
<meta name="theme-color" content="#101b31">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root{--navy:#101b31;--ivory:#f7f4ea;--gold:#c2a058}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:#1b2434;background:var(--ivory);
    background-image:radial-gradient(900px 380px at 20% -10%, rgba(194,160,88,.18), transparent 62%);
  }
  .box{max-width:420px;text-align:center}
  .mark{
    width:64px;height:64px;margin:0 auto 18px;border-radius:18px;
    background:linear-gradient(160deg,#23345a,#101b31);border:1px solid rgba(194,160,88,.55);
    display:grid;place-items:center;
  }
  .mark svg{width:34px;height:34px}
  h1{margin:0 0 8px;font-size:20px;letter-spacing:-.01em;color:var(--navy)}
  p{margin:0 0 20px;font-size:14px;color:#5b6273;line-height:1.7}
  button{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;
    background:linear-gradient(160deg,#26406e,#16233f);color:#f7f4ea;
    padding:12px 24px;border-radius:12px;
  }
  small{display:block;margin-top:18px;font-size:11.5px;color:#8b8f9a}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 4.5v23" stroke="#e7d9b8" stroke-width="2.1" stroke-linecap="round"/><path d="M9.5 12.2h13" stroke="#e7d9b8" stroke-width="2.1" stroke-linecap="round"/><path d="M8 27.5c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#c2a058" stroke-width="1.6" stroke-linecap="round" opacity=".85"/></svg>
    </div>
    <h1>지금 연결되어 있지 않습니다</h1>
    <p>인터넷이 끊겨 포털을 새로 불러오지 못했습니다.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
    <small>덕신교회 통합 포털</small>
  </div>
</body>
</html>
